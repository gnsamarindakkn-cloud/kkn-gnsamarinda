<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>web - KKN Gunung Samarinda </title>
  
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
     
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="bg-[#F9F6F0] text-[#4A403A] antialiased min-h-screen flex flex-col selection:bg-[#D3C5B4] selection:text-[#4A403A]">

    <section class="relative w-full h-[70vh] md:h-[80vh] flex flex-col items-center justify-center text-center px-4 overflow-hidden border-b border-[#EBE4DC]">
   
        <div class="absolute inset-0 z-0">
            <img src="img/hero-bg.jpg" alt="Hero Background" class="w-full h-full object-cover filter brightness-[0.75] contrast-[0.9]" onerror="this.style.display='none';">
            <div class="absolute inset-0 bg-gradient-to-b from-[#F9F6F0]/40 via-[#F9F6F0]/65 to-[#F9F6F0]"></div>
        </div>

        <div class="relative z-10 space-y-4 max-w-3xl mx-auto flex flex-col items-center">
           
            <div class="flex items-center justify-center gap-4 md:gap-8 mb-2">
                
                <div class="w-36 h-36 md:w-52 md:h-52 flex items-center justify-center drop-shadow-2xl">
                    <img src="img/Logo KKN.png" alt="Logo KKN" class="w-full h-full object-contain filter drop-shadow-xl" onerror="this.style.display='none'; this.parentElement.innerHTML='<span class=\'text-sm font-bold text-[#8D7B68]\'>LOGO 1</span>';">
                </div>
          
                <div class="w-36 h-36 md:w-52 md:h-52 flex items-center justify-center drop-shadow-2xl">
                    <img src="img/logo2.png" alt="Logo Kedua" class="w-full h-full object-contain filter drop-shadow-xl" onerror="this.style.display='none'; this.parentElement.innerHTML='<span class=\'text-sm font-bold text-[#8D7B68]\'>LOGO 2</span>';">
                </div>
            </div>
            
            <h1 class="text-3xl md:text-5xl font-bold tracking-tight text-[#4A403A] drop-shadow-sm">
                KKN Gunung Samarinda 
            </h1>
            <p class="text-sm md:text-base text-[#7A6B5D] font-medium tracking-wide">
                Balikpapan, Kalimantan Timur
            </p>
        </div>

        <div class="absolute bottom-4 z-10 text-[11px] tracking-wider text-[#8D7B68] uppercase font-medium">
            Archived by Tim KKN Gunung Samarinda 
        </div>
    </section>

    <section class="max-w-5xl mx-auto px-6 py-10 w-full flex flex-wrap items-center justify-center gap-3 md:gap-4">
        <span class="px-5 py-2 rounded-full border border-[#D3C5B4] text-xs md:text-sm tracking-wide bg-[#8D7B68] text-white cursor-pointer shadow-sm">All</span>
        <span class="px-5 py-2 rounded-full border border-[#EBE4DC] text-xs md:text-sm tracking-wide text-[#7A6B5D] bg-white/60 hover:border-[#8D7B68] hover:text-[#4A403A] transition cursor-pointer shadow-sm">Proker</span>
    </section>

    <section id="explore" class="max-w-6xl mx-auto px-6 py-6 w-full relative">

        <button onclick="slideSlider('left')" class="absolute left-2 md:left-2 top-1/2 -translate-y-1/2 z-20 bg-white/80 hover:bg-white text-[#4A403A] p-3 rounded-full shadow-lg border border-[#EBE4DC] backdrop-blur-sm transition cursor-pointer">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
            </svg>
        </button>

        <button onclick="slideSlider('right')" class="absolute right-2 md:right-2 top-1/2 -translate-y-1/2 z-20 bg-white/80 hover:bg-white text-[#4A403A] p-3 rounded-full shadow-lg border border-[#EBE4DC] backdrop-blur-sm transition cursor-pointer">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
            </svg>
        </button>

        <div id="sliderContainer" class="flex items-center gap-4 md:gap-6 w-full overflow-x-auto py-4 px-10 no-scrollbar scroll-smooth">

            <div class="w-64 md:w-80 h-40 md:h-48 rounded-2xl overflow-hidden bg-[#EBE4DC] flex-shrink-0 border border-[#D3C5B4] opacity-75 hover:opacity-100 transition duration-300 shadow-md">
                <img src="img/spotlight-1.jpeg" alt="Spotlight 1" class="w-full h-full object-cover" onerror="this.style.display='none';">
            </div>

            <div class="w-64 md:w-80 h-40 md:h-48 rounded-2xl overflow-hidden bg-[#EBE4DC] flex-shrink-0 border border-[#D3C5B4] opacity-75 hover:opacity-100 transition duration-300 shadow-md">
                <img src="img/spotlight-2.jpeg" alt="Spotlight 2" class="w-full h-full object-cover" onerror="this.style.display='none';">
            </div>

            <div class="w-64 md:w-80 h-40 md:h-48 rounded-2xl overflow-hidden bg-[#EBE4DC] flex-shrink-0 border border-[#D3C5B4] opacity-75 hover:opacity-100 transition duration-300 shadow-md">
                <img src="img/spotlight-3.jpeg" alt="Spotlight 3" class="w-full h-full object-cover" onerror="this.style.display='none';">
            </div>

            <div class="w-64 md:w-80 h-40 md:h-48 rounded-2xl overflow-hidden bg-[#EBE4DC] flex-shrink-0 border border-[#D3C5B4] opacity-75 hover:opacity-100 transition duration-300 shadow-md">
                <img src="img/spotlight-4.jpg" alt="Spotlight 4" class="w-full h-full object-cover" onerror="this.style.display='none';">
            </div>

            <div class="w-64 md:w-80 h-40 md:h-48 rounded-2xl overflow-hidden bg-[#EBE4DC] flex-shrink-0 border border-[#D3C5B4] opacity-75 hover:opacity-100 transition duration-300 shadow-md">
                <img src="img/spotlight-5.jpg" alt="Spotlight 5" class="w-full h-full object-cover" onerror="this.style.display='none';">
            </div>

            <div class="w-64 md:w-80 h-40 md:h-48 rounded-2xl overflow-hidden bg-[#EBE4DC] flex-shrink-0 border border-[#D3C5B4] opacity-75 hover:opacity-100 transition duration-300 shadow-md">
                <img src="img/spotlight-6.jpg" alt="Spotlight 6" class="w-full h-full object-cover" onerror="this.style.display='none';">
            </div>

        </div>
    </section>

    <section id="moment" class="max-w-6xl mx-auto px-6 py-16 w-full">
        <div class="mb-8">
            <h3 class="text-xl md:text-2xl font-semibold tracking-wide text-[#4A403A]">Capture the moment</h3>
            <p class="text-xs text-[#7A6B5D] mt-1">Koleksi memori perjalanan KKN kami.</p>
        </div>

        <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4 md:gap-6">
            <div class="aspect-[4/3] bg-white rounded-xl overflow-hidden border border-[#EBE4DC] shadow-sm hover:scale-[1.02] transition duration-300 flex items-center justify-center text-[#7A6B5D] text-xs">
                <img src="img/moment-1.jpg" alt="Moment 1" class="w-full h-full object-cover" onerror="this.style.display='none'; this.parentElement.innerHTML='<span>Moment 1</span>';">
            </div>
            <div class="aspect-[4/3] bg-white rounded-xl overflow-hidden border border-[#EBE4DC] shadow-sm hover:scale-[1.02] transition duration-300 flex items-center justify-center text-[#7A6B5D] text-xs">
                <img src="img/moment-2.jpg" alt="Moment 2" class="w-full h-full object-cover" onerror="this.style.display='none'; this.parentElement.innerHTML='<span>Moment 2</span>';">
            </div>
            <div class="aspect-[4/3] bg-white rounded-xl overflow-hidden border border-[#EBE4DC] shadow-sm hover:scale-[1.02] transition duration-300 flex items-center justify-center text-[#7A6B5D] text-xs">
                <img src="img/moment-3.jpg" alt="Moment 3" class="w-full h-full object-cover" onerror="this.style.display='none'; this.parentElement.innerHTML='<span>Moment 3</span>';">
            </div>
            <div class="aspect-[4/3] bg-white rounded-xl overflow-hidden border border-[#EBE4DC] shadow-sm hover:scale-[1.02] transition duration-300 flex items-center justify-center text-[#7A6B5D] text-xs">
                <img src="img/moment-4.jpg" alt="Moment 4" class="w-full h-full object-cover" onerror="this.style.display='none'; this.parentElement.innerHTML='<span>Moment 4</span>';">
            </div>
            <div class="aspect-[4/3] bg-white rounded-xl overflow-hidden border border-[#EBE4DC] shadow-sm hover:scale-[1.02] transition duration-300 flex items-center justify-center text-[#7A6B5D] text-xs">
                <img src="img/moment-5.jpg" alt="Moment 5" class="w-full h-full object-cover" onerror="this.style.display='none'; this.parentElement.innerHTML='<span>Moment 5</span>';">
            </div>
            <div class="aspect-[4/3] bg-white rounded-xl overflow-hidden border border-[#EBE4DC] shadow-sm hover:scale-[1.02] transition duration-300 flex items-center justify-center text-[#7A6B5D] text-xs">
                <img src="img/moment-6.jpg" alt="Moment 6" class="w-full h-full object-cover" onerror="this.style.display='none'; this.parentElement.innerHTML='<span>Moment 6</span>';">
            </div>
            <div class="aspect-[4/3] bg-white rounded-xl overflow-hidden border border-[#EBE4DC] shadow-sm hover:scale-[1.02] transition duration-300 flex items-center justify-center text-[#7A6B5D] text-xs">
                <img src="img/moment-7.jpg" alt="Moment 7" class="w-full h-full object-cover" onerror="this.style.display='none'; this.parentElement.innerHTML='<span>Moment 7</span>';">
            </div>
            <div class="aspect-[4/3] bg-white rounded-xl overflow-hidden border border-[#EBE4DC] shadow-sm hover:scale-[1.02] transition duration-300 flex items-center justify-center text-[#7A6B5D] text-xs">
                <img src="img/moment-8.jpg" alt="Moment 8" class="w-full h-full object-cover" onerror="this.style.display='none'; this.parentElement.innerHTML='<span>Moment 8</span>';">
            </div>
        </div>

        <div class="mt-12 flex justify-center">
            <a href="galery.html" class="px-8 py-3 rounded-full bg-[#8D7B68] text-white text-xs md:text-sm font-medium tracking-widest uppercase hover:bg-[#7A6B5D] transition duration-300 shadow-md flex items-center gap-2">
                <span>View All Gallery</span>
                <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3" />
                </svg>
            </a>
        </div>
    </section>

    <footer class="w-full py-10 px-6 border-t border-[#EBE4DC] bg-white/40 mt-auto flex flex-col sm:flex-row justify-between items-center text-xs text-[#7A6B5D]">
        <p>Made with 🤎 by KKN Gunung Samarinda </p>
        <p class="mt-2 sm:mt-0">Inspirated by Journal Aesthetic</p>
    </footer>

    <script>
        function slideSlider(direction) {
            const container = document.getElementById('sliderContainer');
            const scrollAmount = 350; 
            if (direction === 'left') {
                container.scrollBy({ left: -scrollAmount, behavior: 'smooth' });
            } else {
                container.scrollBy({ left: scrollAmount, behavior: 'smooth' });
            }
        }
    </script>

</body>
</html>
