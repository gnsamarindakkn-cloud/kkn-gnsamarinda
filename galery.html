<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Gallery - KKN Gunung Samarinda 2</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Google Fonts: Plus Jakarta Sans -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
    </style>
</head>
<body class="bg-[#F9F6F0] text-[#4A403A] antialiased min-h-screen flex flex-col selection:bg-[#D3C5B4] selection:text-[#4A403A]">

    <!-- Header / Top Bar dengan Tombol Kembali -->
    <header class="w-full py-6 px-8 flex justify-between items-center border-b border-[#EBE4DC] bg-white/50 backdrop-blur-md sticky top-0 z-50">
        <a href="index.html" class="flex items-center gap-2 text-xs md:text-sm font-medium tracking-wide text-[#8D7B68] hover:text-[#4A403A] transition">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
            </svg>
            <span>Back to Home</span>
        </a>
        <h1 class="text-xs md:text-sm font-semibold tracking-widest uppercase text-[#4A403A]">Full Gallery</h1>
        <div class="w-20"></div> <!-- Spacer untuk menyeimbangkan posisi judul -->
    </header>

    <!-- Title Section -->
    <section class="max-w-6xl mx-auto px-6 pt-12 pb-6 w-full text-center">
        <h2 class="text-2xl md:text-4xl font-bold tracking-tight text-[#4A403A]">Dokumentasi Lengkap KKN</h2>
        <p class="text-xs md:text-sm text-[#7A6B5D] mt-2">Seluruh arsip foto kegiatan, proker, dan kebersamaan di Gunung Samarinda 2.</p>
    </section>

    <!-- Category Filter Buttons -->
    <section class="max-w-5xl mx-auto px-6 py-6 w-full flex flex-wrap items-center justify-center gap-3 md:gap-4">
        <button class="px-5 py-2 rounded-full border border-[#D3C5B4] text-xs md:text-sm tracking-wide bg-[#8D7B68] text-white cursor-pointer shadow-sm transition">All</button>
        <button class="px-5 py-2 rounded-full border border-[#EBE4DC] text-xs md:text-sm tracking-wide text-[#7A6B5D] bg-white/60 hover:border-[#8D7B68] hover:text-[#4A403A] transition cursor-pointer shadow-sm">Proker</button>
        <button class="px-5 py-2 rounded-full border border-[#EBE4DC] text-xs md:text-sm tracking-wide text-[#7A6B5D] bg-white/60 hover:border-[#8D7B68] hover:text-[#4A403A] transition cursor-pointer shadow-sm">Warga</button>
        <button class="px-5 py-2 rounded-full border border-[#EBE4DC] text-xs md:text-sm tracking-wide text-[#7A6B5D] bg-white/60 hover:border-[#8D7B68] hover:text-[#4A403A] transition cursor-pointer shadow-sm">Desa</button>
        <button class="px-5 py-2 rounded-full border border-[#EBE4DC] text-xs md:text-sm tracking-wide text-[#7A6B5D] bg-white/60 hover:border-[#8D7B68] hover:text-[#4A403A] transition cursor-pointer shadow-sm">Photo</button>
    </section>

    <!-- Gallery Grid Section (Menampilkan banyak foto) -->

            <!-- Looping Foto Galeri (Bisa ditambah sesuai kebutuhan) -->
            <div class="aspect-[4/3] bg-white rounded-xl overflow-hidden border border-[#EBE4DC] shadow-sm hover:scale-[1.02] transition duration-300 flex items-center justify-center text-[#7A6B5D] text-xs">
                <img src="img/moment-1.jpg" alt="Gallery 1" class="w-full h-full object-cover" onerror="this.style.display='none'; this.parentElement.innerHTML='<span>Photo 1</span>';">
            </div>
            <div class="aspect-[4/3] bg-white rounded-xl overflow-hidden border border-[#EBE4DC] shadow-sm hover:scale-[1.02] transition duration-300 flex items-center justify-center text-[#7A6B5D] text-xs">
                <img src="img/moment-2.jpg" alt="Gallery 2" class="w-full h-full object-cover" onerror="this.style.display='none'; this.parentElement.innerHTML='<span>Photo 2</span>';">
            </div>

            </div>

                <img src="img/moment-5.jpg" alt="Gallery 5" class="w-full h-full object-cover" onerror="this.style.display='none'; this.parentElement.innerHTML='<span>Photo 5</span>';">

            <div class="aspect-[4/3] bg-white rounded-xl overflow-hidden border border-[#EBE4DC] shadow-sm hover:scale-[1.02] transition duration-300 flex items-center justify-center text-[#7A6B5D] text-xs">
                <img src="img/moment-6.jpg" alt="Gallery 6" class="w-full h-full object-cover" onerror="this.style.display='none'; this.parentElement.innerHTML='<span>Photo 6</span>';">
            </div>
            <div class="aspect-[4/3] bg-white rounded-xl overflow-hidden border border-[#EBE4DC] shadow-sm hover:scale-[1.02] transition duration-300 flex items-center justify-center text-[#7A6B5D] text-xs">
                <img src="img/moment-7.jpg" alt="Gallery 7" class="w-full h-full object-cover" onerror="this.style.display='none'; this.parentElement.innerHTML='<span>Photo 7</span>';">

            </div>

            </div>

                <img src="img/moment-10.jpg" alt="Gallery 10" class="w-full h-full object-cover" onerror="this.style.display='none'; this.parentElement.innerHTML='<span>Photo 10</span>';">
            </div>
            <div class="aspect-[4/3] bg-white rounded-xl overflow-hidden border border-[#EBE4DC] shadow-sm hover:scale-[1.02] transition duration-300 flex items-center justify-center text-[#7A6B5D] text-xs">
